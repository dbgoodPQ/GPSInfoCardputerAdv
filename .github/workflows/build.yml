name: Build firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to a release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIO_ENV: m5cardputer-adv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -e "$PIO_ENV"

      - name: Collect firmware files
        run: |
          set -e
          B=".pio/build/$PIO_ENV"
          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          mkdir -p dist
          cp "$B/firmware.bin" "$B/bootloader.bin" "$B/partitions.bin" "$BOOT_APP0" dist/
          # Single image to flash at address 0x0 (ESP32-S3).
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32s3 merge_bin \
            -o dist/GPSInfoCardputerAdv-merged.bin \
            --flash_mode dio --flash_size keep \
            0x0 "$B/bootloader.bin" \
            0x8000 "$B/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$B/firmware.bin"
          cp cpGpsInfo.conf.example dist/
          cat > dist/FLASHING.txt <<'EOF'
          Cardputer ADV - GPS Info (external display fork)

          Easiest: flash the single merged image at address 0x0
            esptool.py --chip esp32s3 --port <PORT> write_flash 0x0 GPSInfoCardputerAdv-merged.bin
          (or use https://espressif.github.io/esptool-js/ with address 0x0)

          Separate files:
            0x0      bootloader.bin
            0x8000   partitions.bin
            0xe000   boot_app0.bin
            0x10000  firmware.bin

          firmware.bin alone can also be loaded from an SD launcher (e.g. M5Launcher).

          Config: copy cpGpsInfo.conf.example to the SD card root as cpGpsInfo.conf
          EOF
          sed -i 's/^          //' dist/FLASHING.txt
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPSInfoCardputerAdv-firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
